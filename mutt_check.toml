[[mutant]]
name = "floor_equals_one_observation"
why = "A floor of one makes 'never said it' tie with 'said it once', the ordering the floor exists to give."
suites = ["tests.test_voice_tics.BaselineFloorTest"]
file = "voice_tics.py"
find = "BASELINE_FLOOR_COUNT = 0.5"
replace = "BASELINE_FLOOR_COUNT = 1.0"

