# The curated mutation gate for voice_tics.
#
# Every entry reverts ONE decision the code depends on and names why that
# decision exists. `suites` names the test class that pins it, so this file doubles as
# a map from each decision to its test. `make check` runs it after the unit
# suite.
#
# A mutant goes in here only together with the test that kills it. A known
# survivor would be a to-do dressed as evidence.
#
# Run: mutt_check           (needs https://github.com/nlmundis/mutt_check)

[run]
suites = ["tests.test_voice_tics", "tests.test_prose_lint",
          "tests.test_emdash", "tests.test_samples", "tests.test_repo"]
timeout = 300

# --- the thing that makes this tool different ------------------------------

[[mutant]]
name = "signatures_ship_with_someone_elses_habits"
why = "A default signature table presents one person's writing as everyone's. Empty is the claim."
suites = ["tests.test_voice_tics.PatternTest"]
file = "voice_tics.py"
find = "BASELINE_SIGNATURES: Tuple[Tuple[str, str], ...] = ()"
replace = 'BASELINE_SIGNATURES: Tuple[Tuple[str, str], ...] = (("however", r"\\bhowever\\b"),)'

[[mutant]]
name = "emdash_rule_ships_on"
why = "One author's punctuation rule failing everyone's build is the exact error this repo argues against."
suites = ["tests.test_prose_lint.Wiring"]
file = "vt_config.py"
find = "                 emdash_enabled: bool = False,"
replace = "                 emdash_enabled: bool = True,"

# --- the sample baseline ---------------------------------------------------

[[mutant]]
name = "sample_baseline_blends_with_user_turns"
why = "Blending builds a corpus that is neither register, weighted by whichever side is larger."
suites = ["tests.test_samples.SampleBaselineEndToEndTest"]
file = "voice_tics.py"
find = "        if not is_model and samples:"
replace = "        if not is_model and False:"

[[mutant]]
name = "empty_sample_glob_measures_against_nothing"
why = "A silent empty baseline makes every ratio infinite and the report meaningless."
suites = ["tests.test_samples.SampleBaselineEndToEndTest"]
file = "voice_tics.py"
find = '''        if not stats.get("sample_paragraphs"):'''
replace = '''        if False:'''

[[mutant]]
name = "unreadable_sample_kills_the_run"
why = "One bad file in a corpus of hundreds must not cost the measurement."
suites = ["tests.test_samples.ReadSamplesTest"]
file = "voice_tics.py"
find = "        except (OSError, UnicodeDecodeError):"
replace = "        except OSError:"

[[mutant]]
name = "front_matter_counted_as_prose"
why = "YAML keys would rank as phrases and pollute every n-gram table."
suites = ["tests.test_samples.ReadSamplesTest"]
file = "voice_tics.py"
find = '        raw = FRONT_MATTER_RE.sub("", raw, count=1)'
replace = "        pass"

# --- the contamination guard ----------------------------------------------

[[mutant]]
name = "contamination_guard_counts_one_sided_structures"
why = "A zero on either side is the floor correction talking, not agreement between authors."
suites = ["tests.test_samples.ContaminationWarningTest"]
file = "voice_tics.py"
find = "        if m_count and t_count:"
replace = "        if m_count or t_count:"

[[mutant]]
name = "contamination_guard_fires_on_thin_data"
why = "Four comparable structures cannot support the claim; firing there is noise that trains people to ignore it."
suites = ["tests.test_samples.ContaminationWarningTest"]
file = "voice_tics.py"
find = "    if comparable < 5:"
replace = "    if comparable < 0:"

[[mutant]]
name = "contamination_band_is_asymmetric"
why = "0.8 and 1.25 are the same distance from parity inverted; an arithmetic band favours one direction."
suites = ["tests.test_samples.ContaminationWarningTest"]
file = "voice_tics.py"
find = "INDISTINGUISHABLE = (0.8, 1.25)"
replace = "INDISTINGUISHABLE = (0.8, 1.2)"

# --- config: silence is the failure mode -----------------------------------

[[mutant]]
name = "unknown_config_key_ignored"
why = "A misspelled key silently ignored is a setting the user believes is in force and is not."
suites = ["tests.test_samples.SamplesConfigTest"]
file = "vt_config.py"
find = "            raise ConfigError(f\"unknown key {key!r} in {where}{hint}\")"
replace = "            pass"

[[mutant]]
name = "duplicate_signature_names_silently_collapse"
why = "Counts are keyed by name, so the later entry would replace the earlier one with no sign."
suites = ["tests.test_samples.SamplesConfigTest"]
file = "vt_config.py"
find = "        if name in seen:"
replace = "        if False:"

[[mutant]]
name = "named_config_file_missing_is_not_an_error"
why = "A --config the user typed and the tool ignored is worse than a crash."
suites = ["tests.test_samples.SamplesConfigTest"]
file = "vt_config.py"
find = "        if named:"
replace = "        if False:"

# --- the linter's loud-failure contract ------------------------------------

[[mutant]]
name = "retired_tic_key_lints_silently"
why = "A rule that quietly stopped being checked is worse than a crash: the build goes green."
suites = ["tests.test_prose_lint.Wiring"]
file = "prose_lint.py"
find = "    raise KeyError("
replace = "    return re.compile(r'(?!x)x'), ''  # noqa\n    raise KeyError("

# --- redaction fails toward over-redacting ---------------------------------

[[mutant]]
name = "allowlist_matched_as_a_substring"
why = "A substring test fails open three ways, each leaving a real external address in cleartext."
suites = ["tests.test_repo.RedactionTest"]
file = "vt_redact.py"
find = "    domain = email.lower().strip().rpartition(\"@\")[2]"
replace = "    domain = email.lower().strip()"

[[mutant]]
name = "redaction_allowlist_defaults_to_open"
why = "An allowlist shipped with somebody's domains in it is a leak with a default value."
suites = ["tests.test_repo.RedactionTest"]
file = "vt_redact.py"
find = "def redact(text: str, keep_domains: Sequence[str] = ()) -> str:"
replace = "def redact(text: str, keep_domains: Sequence[str] = (\"com\",)) -> str:"

# --- the fence scan must stay linear AND stay equal to the spec ----------

[[mutant]]
name = "fence_closer_may_sit_on_the_opener_line"
why = "A fence needs the newline between opener and closer; otherwise a single ``` line is a whole fence."
suites = ["tests.test_voice_tics.FenceScanTest"]
file = "emdash.py"
find = "        elif (char == opener[1] and run >= opener[2]"
replace = "        if opener[1] and (char == opener[1] and run >= opener[2]"

[[mutant]]
name = "backtick_in_the_info_string_opens_a_fence"
why = "An inline ```x``` at line start swallowed the prose after it and desynchronised the next real fence."
suites = ["tests.test_voice_tics.FenceScanTest"]
file = "emdash.py"
find = '            if run >= 3 and (char == "~" or "`" not in body[run:]):'
replace = "            if run >= 3:"

[[mutant]]
name = "a_shorter_run_closes_a_longer_fence"
why = "A four-backtick fence exists to show a three-backtick one inside it."
suites = ["tests.test_voice_tics.FenceScanTest"]
file = "emdash.py"
find = "        elif (char == opener[1] and run >= opener[2]"
replace = "        elif (char == opener[1] and run >= 3"

[[mutant]]
name = "tilde_fences_are_prose"
why = "The tilde fence is what an author reaches for when the sample holds backticks; its code failed the build."
suites = ["tests.test_voice_tics.FenceScanTest"]
file = "emdash.py"
find = '        run = len(body) - len(body.lstrip(char)) if char in ("`", "~") else 0'
replace = '        run = len(body) - len(body.lstrip(char)) if char == "`" else 0'

[[mutant]]
name = "crlf_closer_not_recognised"
why = "Piped on stdin CRLF is not translated, so the same bytes passed as a file and failed as a pipe."
suites = ["tests.test_voice_tics.FenceScanTest", "tests.test_prose_lint.OneEngineForEveryRule"]
file = "emdash.py"
find = '              and not body[run:].strip(FENCE_INDENT + "\r")):'
replace = "              and not body[run:].strip(FENCE_INDENT)):"

[[mutant]]
name = "no_break_space_indent_is_not_a_fence"
why = "scrub folds U+00A0 before scanning and strip_code does not; disagreeing, code inside the fence was linted as a cell."
suites = ["tests.test_voice_tics.FenceScanTest", "tests.test_prose_lint.OneEngineForEveryRule"]
file = "emdash.py"
find = 'FENCE_INDENT = " \t\u00a0"'
replace = 'FENCE_INDENT = " \t"'

# --- banned phrases: a preference, kept out of the evidence ---------------

[[mutant]]
name = "banned_phrases_ship_non_empty"
why = "A shipped ban list is one person's taste imposed on every reader of the tool."
suites = ["tests.test_prose_lint.BannedPhrases"]
file = "vt_config.py"
find = "                 banned: Sequence[Tuple[str, str, str]] = (),"
replace = '                 banned: Sequence[Tuple[str, str, str]] = (("load bearing", "", "error"),),'

[[mutant]]
name = "banned_phrase_treated_as_a_regex"
why = "A phrase is typed by someone sick of it, not authored as a pattern; 'C++' as a regex is an error."
suites = ["tests.test_prose_lint.BannedPhrases"]
file = "prose_lint.py"
find = '    words = [re.escape(w) for w in config_mod.banned_words(phrase)]'
replace = '    words = [w for w in config_mod.banned_words(phrase)]'

[[mutant]]
name = "hyphen_and_space_are_different_phrases"
why = "The hyphen is typesetting, not a different phrase; requiring both entries is how half a ban misses."
suites = ["tests.test_prose_lint.BannedPhrases"]
file = "prose_lint.py"
find = '    body = r"[-\s]+".join(words)'
replace = '    body = r"\s+".join(words)'

[[mutant]]
name = "banned_phrase_matches_mid_word"
why = "'overload bearing' is not the banned phrase; without boundaries a ban fires inside longer words."
suites = ["tests.test_prose_lint.BannedPhrases"]
file = "prose_lint.py"
find = '    lead = r"\b" if re.match(r"\w", phrase.strip()) else ""'
replace = '    lead = ""'

[[mutant]]
name = "banned_phrase_counted_inside_code"
why = "A phrase in a code sample is not the author's prose, and flagging it trains people to ignore the linter."
suites = ["tests.test_prose_lint.BannedPhrases"]
file = "prose_lint.py"
find = "    body = voice_tics.scrub(body_input, keep_lines=True)"
replace = "    body = body_input"

[[mutant]]
name = "duplicate_banned_phrases_silently_collapse"
why = "Two spellings of one phrase normalise to the same key; the later would replace the earlier with no sign."
suites = ["tests.test_prose_lint.BannedPhraseConfig"]
file = "vt_config.py"
find = "        if key in seen:"
replace = "        if False:"

# --- the em-dash exemption is the hole, so it stays narrow -----------------

[[mutant]]
name = "bad_exempt_pattern_raises_instead_of_disarming"
why = "An escaping exception reaches a caller's top-level handler, exits 0, and disarms the whole check."
suites = ["tests.test_emdash.EvidenceCitationExemptionTest"]
file = "emdash.py"
find = "    except re.error:\n        return []"
replace = "    except ZeroDivisionError:\n        return []"

[[mutant]]
name = "exempt_pattern_dropped_on_the_way_through"
why = "lone_dash_blocks must pass the pattern down; dropping it silently disables every caller's exemption."
suites = ["tests.test_emdash.EvidenceCitationExemptionTest"]
file = "emdash.py"
find = "in lone_dash_lines(text, exempt)]"
replace = "in lone_dash_lines(text)]"

[[mutant]]
name = "label_exception_applied_to_prose"
why = "Applying the table-cell label exception to prose inverts the check; it produced 1,334 bogus findings once."
suites = ["tests.test_emdash.LoneDashTest"]
file = "emdash.py"
find = "        if is_cell and blank(blk, spans).count(EM_DASH) % 2 == 1:"
replace = "        if True:"

# --- the published claims: stdlib only, a gate that cannot skip -----------

[[mutant]]
name = "config_parser_imported_at_module_scope"
why = "On 3.9 and 3.10 there is no tomllib; a module-scope import kills both entry points before argparse, config file or not."
suites = ["tests.test_repo.StdlibOnlyTest"]
file = "vt_config.py"
find = 'CONFIG_NAME = "voice_tics.toml"'
replace = "try:\n    import tomllib\nexcept ImportError:\n    import tomli as tomllib\nCONFIG_NAME = \"voice_tics.toml\""

[[mutant]]
name = "suite_reads_the_developers_own_config"
why = "main() reads ./voice_tics.toml; run from the repo root, a personal config turns the suite red for reasons unrelated to the code."
suites = ["tests.test_repo.HermeticSuiteTest"]
file = "tests/support.py"
find = "    os.chdir(tmp.name)"
replace = "    pass"

[[mutant]]
name = "scratch_files_written_to_the_shared_temp_dir"
why = "Fifteen files left in TMPDIR per run, accumulating run over run; inside the module's own directory one cleanup removes them all."
suites = ["tests.test_repo.HermeticSuiteTest"]
file = "tests/support.py"
find = "    directory = _stack[-1].name"
replace = "    directory = tempfile.gettempdir()"

[[mutant]]
name = "missing_gate_reads_as_a_passed_gate"
why = "A mutation gate that skips when its tool is absent turns `make check` green without checking anything."
suites = ["tests.test_repo.GateTest"]
file = "Makefile"
find = "\t  exit 2; \\"
replace = "\t  exit 0; \\"

# --- redaction: no allowlist of name characters, no fixed phone shape ------

[[mutant]]
name = "local_part_is_a_character_allowlist"
why = "Every allowlist forgets a character, and each one prints the head of the name while the guard appears to fire."
suites = ["tests.test_repo.RedactionTest"]
file = "vt_redact.py"
find = '    local = r"(?<![^%s])[^%s]+" % (_DELIMITERS, _DELIMITERS)'
replace = '    local = r"[\w%s.%%+-]+" % marks'

[[mutant]]
name = "address_match_may_start_mid_token"
why = "Without the start guard a long token is rescanned from every offset: quadratic on a base64 blob."
suites = ["tests.test_repo.RedactionTest"]
file = "vt_redact.py"
find = '    local = r"(?<![^%s])[^%s]+" % (_DELIMITERS, _DELIMITERS)'
replace = '    local = r"[^%s]+" % _DELIMITERS'

[[mutant]]
name = "mark_scan_stops_at_the_bmp"
why = "Adlam is a living script with its marks above U+1E943; a domain carrying one was not matched at all."
suites = ["tests.test_repo.RedactionTest"]
file = "vt_redact.py"
find = "    marks = [c for c in range(0x300, 0x110000)"
replace = "    marks = [c for c in range(0x300, 0x10000)"

[[mutant]]
name = "phone_needs_a_separator_between_groups"
why = "(555)123-4567, 5551234567 and every international rendering printed in cleartext."
suites = ["tests.test_repo.RedactionTest"]
file = "vt_redact.py"
find = 'PHONE_RE = re.compile(r"(?<!\d)\+?\(?\d(?:%s{0,3}\d){9,14}(?!\d)" % _PHONE_SEP)'
replace = 'PHONE_RE = re.compile(r"\(?\b\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b")'

[[mutant]]
name = "inert_keep_domains_entry_accepted"
why = "'.example.com' matches nothing, so the addresses it was meant to keep are redacted with no sign the setting is not in force."
suites = ["tests.test_repo.KeepDomainsConfigTest"]
file = "vt_config.py"
find = "        if (not bare or bare != entry or \"@\" in entry"
replace = "        if (not bare or \"@\" in entry"

[[mutant]]
name = "text_report_phrases_skip_redaction"
why = "The belt under the source-text gate; nothing else would notice it gone until the tokeniser widens."
suites = ["tests.test_voice_tics.SourceTextRedactionTest"]
file = "voice_tics.py"
find = "                       f\"{redact(f.phrase, keep_domains)}\")"
replace = "                       f\"{f.phrase}\")"

[[mutant]]
name = "text_report_openers_skip_redaction"
why = "The belt under the source-text gate; nothing else would notice it gone until the tokeniser widens."
suites = ["tests.test_voice_tics.SourceTextRedactionTest"]
file = "voice_tics.py"
find = "                       f\"{redact(opener, keep_domains)}\")"
replace = "                       f\"{opener}\")"

[[mutant]]
name = "json_phrases_skip_redaction"
why = "The belt under the source-text gate; nothing else would notice it gone until the tokeniser widens."
suites = ["tests.test_voice_tics.SourceTextRedactionTest"]
file = "voice_tics.py"
find = "phrase=redact(f.phrase, cfg.keep_domains))"
replace = "phrase=f.phrase)"

[[mutant]]
name = "json_openers_skip_redaction"
why = "The belt under the source-text gate; nothing else would notice it gone until the tokeniser widens."
suites = ["tests.test_voice_tics.SourceTextRedactionTest"]
file = "voice_tics.py"
find = "            doc[\"openers\"] = [(redact(o, cfg.keep_domains), c) for o, c"
replace = "            doc[\"openers\"] = [(o, c) for o, c"

# --- reading transcripts: nothing dropped silently, nothing kept wrongly ---

[[mutant]]
name = "system_reminder_drops_the_typed_prompt"
why = "The harness appends reminders to the record holding the prompt; a whole-record drop deleted real baseline prose and hid scheduled-run markers."
suites = ["tests.test_voice_tics.UserTextTest", "tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = '    raw = SYSTEM_REMINDER_RE.sub("\n", raw)'
replace = "    pass"

[[mutant]]
name = "date_cutoff_runs_before_the_scheduled_run_test"
why = "--days skipped the marker record as too old and re-admitted the rest of the scheduled run, reporting nothing dropped."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = "                message = rec.get(\"message\")\n                if not isinstance(message, dict):"
replace = "                if since is not None and _parse_when(rec) is not None and _parse_when(rec) < since:\n                    continue\n                message = rec.get(\"message\")\n                if not isinstance(message, dict):"

[[mutant]]
name = "meta_records_counted_after_the_noise_filter"
why = "An isMeta record carrying harness markup was excluded and attributed to nothing, understating the reported exclusion."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = "                    if rec.get(\"isMeta\"):\n                        _count(stats, \"meta_records\")"
replace = "                    if not text:\n                        continue\n                    if rec.get(\"isMeta\"):\n                        _count(stats, \"meta_records\")"

[[mutant]]
name = "notice_markers_match_anywhere_in_the_record"
why = "As substrings, 'API Error' and friends deleted the model's own explanations from the corpus the ratios rest on."
suites = ["tests.test_voice_tics.AssistantTextTest"]
file = "voice_tics.py"
find = "    if raw.lstrip().startswith(ASSISTANT_NOISE_MARKERS):"
replace = "    if any(m in raw for m in ASSISTANT_NOISE_MARKERS):"

[[mutant]]
name = "dropped_notices_go_uncounted"
why = "Every other exclusion is reported; an uncounted one is an exclusion nobody can see."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = '                        _count(stats, "noise_records")'
replace = "                        pass"

[[mutant]]
name = "naive_timestamp_left_naive"
why = "One offset-less timestamp aborted the whole scan with TypeError, but only under --days."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = "    return when if when.tzinfo else when.replace(tzinfo=dt.timezone.utc)"
replace = "    return when"

[[mutant]]
name = "non_object_message_reaches_get"
why = "A string message raised AttributeError out of the generator and lost every session after it."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = "                if not isinstance(message, dict):\n                    message = {}"
replace = "                if not message:\n                    message = {}"

[[mutant]]
name = "undecodable_byte_aborts_the_scan"
why = "One bad byte in one transcript would raise out of the generator and cost every other session."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = '            fh = open(path, encoding="utf-8", errors="replace")'
replace = '            fh = open(path, encoding="utf-8")'

[[mutant]]
name = "every_assistant_record_opens_a_response"
why = "83% of the opener table was continuation text after a tool round-trip, so its headline concentration measured something else."
suites = ["tests.test_voice_tics.ReadTurnsTest"]
file = "voice_tics.py"
find = '                turn_opens = opens if kind == "assistant" else True'
replace = "                turn_opens = True"

[[mutant]]
name = "ngrams_span_the_whole_turn"
why = "Phrases welded across sentence breaks and deleted code are strings nobody wrote, concentrated on the model's side."
suites = ["tests.test_voice_tics.NgramTest"]
file = "voice_tics.py"
find = "        for s in sents:\n            for run in s.split(SCRUB_GAP):"
replace = "        for s in [text]:\n            for run in [s]:"

[[mutant]]
name = "ngrams_span_a_scrubbed_gap"
why = "The words either side of a removed code span were never adjacent."
suites = ["tests.test_voice_tics.NgramTest"]
file = "voice_tics.py"
find = "            for run in s.split(SCRUB_GAP):"
replace = "            for run in [s]:"

[[mutant]]
name = "sibling_widest_windows_all_kept"
why = "A repeated string longer than six tokens filled the top rows with its own windows and pushed distinct tics off."
suites = ["tests.test_voice_tics.NgramTest"]
file = "voice_tics.py"
find = "                   and f.mine <= w.mine * 1.35 for w in widest):"
replace = "                   and False for w in widest):"

[[mutant]]
name = "narrow_windows_of_an_absorbed_string_kept"
